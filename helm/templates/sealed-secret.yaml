{{- if .Values.sealedSecret.create }}
{{- if not .Values.sealedSecret.encryptedData }}
{{- fail "sealedSecret.encryptedData must be set when sealedSecret.create is true" }}
{{- end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecret.name }}
  labels:
    {{- include "watcher-in-the-water.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.sealedSecret.name }}
      labels:
        {{- include "watcher-in-the-water.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
